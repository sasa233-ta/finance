{% extends 'base.html' %}
{% block title %}ログイン{% endblock %}
{% block content %}
<div class="row justify-content-center">
  <div class="col-md-6">
    <h2 class="mb-4">ログイン</h2>
    <form id="loginForm">
      <div class="mb-3">
        <label for="username" class="form-label">ユーザー名</label>
        <input type="text" class="form-control" id="username" name="username" required>
      </div>
      <div class="mb-3">
        <label for="password" class="form-label">パスワード</label>
        <input type="password" class="form-control" id="password" name="password" required>
      </div>
      <button type="submit" class="btn btn-primary">ログイン</button>
    </form>
    <div id="loginMsg" class="mt-3"></div>
    <div class="mt-3">
      <a href="{{ url_for('auth.register_page') }}" class="btn btn-secondary">アカウント登録</a>
    </div>
  </div>
</div>
<script>
$(function(){
  $('#loginForm').on('submit', function(e){
    e.preventDefault();
    $.ajax({
      url: '/auth/login',
      type: 'POST',
      contentType: 'application/json',
      data: JSON.stringify({
        username: $('#username').val(),
        password: $('#password').val()
      }),
      success: function(res){
        $('#loginMsg').html('<div class="alert alert-success">' + res.message + '</div>');
        setTimeout(function(){ location.href = '/stocks/'; }, 1000);
      },
      error: function(xhr){
        $('#loginMsg').html('<div class="alert alert-danger">' + xhr.responseJSON.message + '</div>');
      }
    });
  });
});
</script>
{% endblock %}
