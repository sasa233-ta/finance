{% extends 'base.html' %}
{% block title %}ユーザー登録{% endblock %}
{% block content %}
<div class="row justify-content-center">
  <div class="col-md-6">
    <h2 class="mb-4">ユーザー登録</h2>
    <form id="registerForm">
      <div class="mb-3">
        <label for="username" class="form-label">ユーザー名</label>
        <input type="text" class="form-control" id="username" name="username" required>
      </div>
      <div class="mb-3">
        <label for="email" class="form-label">メールアドレス</label>
        <input type="email" class="form-control" id="email" name="email" required>
      </div>
      <div class="mb-3">
        <label for="password" class="form-label">パスワード</label>
        <input type="password" class="form-control" id="password" name="password" required>
      </div>
      <button type="submit" class="btn btn-success">登録</button>
    </form>
    <div id="registerMsg" class="mt-3"></div>
  </div>
</div>
<script>
$(function(){
  $('#registerForm').on('submit', function(e){
    e.preventDefault();
    $.ajax({
      url: '/auth/register',
      type: 'POST',
      contentType: 'application/json',
      data: JSON.stringify({
        username: $('#username').val(),
        email: $('#email').val(),
        password: $('#password').val()
      }),
      success: function(res){
        $('#registerMsg').html('<div class="alert alert-success">登録が完了しました。ログインしてください。</div>');
        setTimeout(function(){ location.href = '/auth/login'; }, 1000);
      },
      error: function(xhr){
        $('#registerMsg').html('<div class="alert alert-danger">' + xhr.responseJSON.message + '</div>');
      }
    });
  });
});
</script>
{% endblock %}
